[package]
name = "taptap"
version = "0.1.0"
edition = "2021"

[dependencies]
crossbeam-channel = "0.5"
rand = "0.8"
resvg = "0.43"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
tiny-skia = "0.11"
tray-icon = "0.19"
muda = "0.15"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
resvg = "0.43"
tiny-skia = "0.11"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true